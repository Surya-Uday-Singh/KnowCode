[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowcode"
version = "0.1.0"
description = "Context-aware Python code summarization tailored by team role (COSC 4426)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",            # client for the DeepSeek API (OpenAI-compatible)
    "pydantic>=2.7",           # schemas for LLM responses and pipeline data
    "pydantic-settings>=2.3",  # typed configuration loaded from .env
]

# Installs the `knowcode` command, which runs knowcode.cli:main.
[project.scripts]
knowcode = "knowcode.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowcode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the tests import the experiment folder, which isn't installed with the package.
pythonpath = ["."]
# Tests marked "live" call the real API (and cost money); run them with: pytest -m live
markers = ["live: calls the real DeepSeek API"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors and undefined names, I: import order, UP: modern syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]
